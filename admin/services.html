<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex">
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-64 bg-white border-r border-gray-100 z-40 hidden lg:flex flex-col">
    <div class="p-5 border-b border-gray-100"><a href="/" class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl gradient-primary flex items-center justify-center"><svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><div class="text-sm font-bold text-gray-900">Dr. Arshadha</div><div class="text-xs text-gray-500">Admin Panel</div></div></a></div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <a href="/admin/index.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
      <a href="/admin/appointments.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Appointments</a>
      <a href="/admin/patients.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Patients</a>
      <a href="/admin/schedule.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>Schedule</a>
      <a href="/admin/services.html" class="sidebar-link active"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Services</a>
      <a href="/admin/payments.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/></svg>Payments</a>
      <hr class="my-3 border-gray-100"><button data-logout class="sidebar-link w-full text-gray-500 hover:text-red-600">Logout</button>
    </nav>
  </aside>
  <div class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-100 z-30 lg:hidden flex items-center justify-between px-4">
    <span class="font-bold text-gray-900">Services</span>
    <button id="sidebar-toggle" class="p-2 rounded-lg hover:bg-gray-100" aria-label="Menu"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>

  <div class="flex-1 lg:ml-64">
    <div class="p-4 sm:p-6 lg:p-8 pt-20 lg:pt-8 max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Services</h1>
        <button id="add-service-btn" class="btn-primary text-sm">Add Service</button>
      </div>

      <!-- Add/Edit Form -->
      <div id="service-form" class="glass-card-strong rounded-2xl p-6 mb-6 hidden">
        <h2 class="text-lg font-semibold text-gray-900 mb-4" id="form-title">Add New Service</h2>
        <form id="service-form-inner" class="space-y-4">
          <input type="hidden" id="edit-id">
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Service Name *</label><input type="text" id="svc-name" class="input-field" required></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Duration (minutes) *</label><input type="number" id="svc-duration" class="input-field" value="30" min="10" max="120"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Consultation Fee</label><input type="number" id="svc-fee" class="input-field" value="500" min="0"></div>
            <div class="flex items-end"><label class="flex items-center gap-2 pb-3"><input type="checkbox" id="svc-active" checked class="w-4 h-4 text-blue-600"><span class="text-sm font-medium text-gray-700">Active</span></label></div>
          </div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1">Description</label><textarea id="svc-desc" class="input-field" rows="2"></textarea></div>
          <div class="flex gap-3">
            <button type="submit" class="btn-primary text-sm">Save Service</button>
            <button type="button" id="cancel-edit" class="btn-secondary text-sm">Cancel</button>
          </div>
        </form>
      </div>

      <div id="services-list" class="space-y-3"></div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>

  <script type="module">
    import { supabase, getCurrentUser, getProfile } from '/js/supabase.js';
    import { showToast } from '/js/ui.js';

    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      const s = document.getElementById('sidebar'); s.classList.toggle('hidden'); s.classList.toggle('fixed'); s.classList.toggle('inset-0'); s.classList.toggle('z-50'); s.classList.toggle('w-full');
    });

    async function init() {
      const user = await getCurrentUser();
      if (!user) { window.location.href = '/login.html'; return; }
      const profile = await getProfile(user.id);
      if (!profile || (profile.role !== 'doctor' && profile.role !== 'admin')) { window.location.href = '/'; return; }
      await loadServices();

      document.getElementById('add-service-btn').addEventListener('click', () => {
        document.getElementById('service-form').classList.toggle('hidden');
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').textContent = 'Add New Service';
        document.getElementById('service-form-inner').reset();
        document.getElementById('svc-active').checked = true;
      });

      document.getElementById('cancel-edit').addEventListener('click', () => {
        document.getElementById('service-form').classList.add('hidden');
      });

      document.getElementById('service-form-inner').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('edit-id').value;
        const data = {
          name: document.getElementById('svc-name').value.trim(),
          duration_minutes: parseInt(document.getElementById('svc-duration').value),
          consultation_fee: parseInt(document.getElementById('svc-fee').value),
          is_active: document.getElementById('svc-active').checked,
          description: document.getElementById('svc-desc').value.trim()
        };
        if (!data.name) { showToast('Service name is required', 'warning'); return; }

        if (id) {
          const { error } = await supabase.from('services').update(data).eq('id', id);
          if (error) { showToast('Failed to update service', 'error'); return; }
          showToast('Service updated', 'success');
        } else {
          const { error } = await supabase.from('services').insert(data);
          if (error) { showToast('Failed to add service', 'error'); return; }
          showToast('Service added', 'success');
        }
        document.getElementById('service-form').classList.add('hidden');
        await loadServices();
      });
    }

    async function loadServices() {
      const { data } = await supabase.from('services').select('*').order('sort_order');
      const container = document.getElementById('services-list');
      if (!data?.length) { container.innerHTML = '<div class="card p-6 text-center text-gray-500">No services yet. Add your first service above.</div>'; return; }
      container.innerHTML = data.map(s => `
        <div class="card p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center gap-4">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-gray-900">${s.name}</span>
              ${s.is_active ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Active</span>' : '<span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">Inactive</span>'}
            </div>
            <div class="text-sm text-gray-500">${s.duration_minutes || 30} min &middot; ₹${s.consultation_fee || 0}</div>
            ${s.description ? `<div class="text-xs text-gray-400 mt-1">${s.description}</div>` : ''}
          </div>
          <div class="flex gap-2">
            <button class="edit-svc text-sm text-blue-600 hover:underline" data-id="${s.id}">Edit</button>
            <button class="delete-svc text-sm text-red-500 hover:underline" data-id="${s.id}">Delete</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.edit-svc').forEach(btn => {
        btn.addEventListener('click', () => {
          const s = data.find(s => s.id === btn.dataset.id);
          if (!s) return;
          document.getElementById('service-form').classList.remove('hidden');
          document.getElementById('form-title').textContent = 'Edit Service';
          document.getElementById('edit-id').value = s.id;
          document.getElementById('svc-name').value = s.name;
          document.getElementById('svc-duration').value = s.duration_minutes;
          document.getElementById('svc-fee').value = s.consultation_fee;
          document.getElementById('svc-active').checked = s.is_active;
          document.getElementById('svc-desc').value = s.description || '';
        });
      });

      container.querySelectorAll('.delete-svc').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this service?')) return;
          await supabase.from('services').delete().eq('id', btn.dataset.id);
          showToast('Service deleted', 'success');
          await loadServices();
        });
      });
    }

    init();
  </script>
</body>
</html>
