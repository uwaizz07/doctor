<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule | Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex">
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-64 bg-white border-r border-gray-100 z-40 hidden lg:flex flex-col">
    <div class="p-5 border-b border-gray-100"><a href="/" class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl gradient-primary flex items-center justify-center"><svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><div class="text-sm font-bold text-gray-900">Dr. Arshadha</div><div class="text-xs text-gray-500">Admin Panel</div></div></a></div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      <a href="/admin/index.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
      <a href="/admin/appointments.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/></svg>Appointments</a>
      <a href="/admin/patients.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Patients</a>
      <a href="/admin/schedule.html" class="sidebar-link active"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>Schedule</a>
      <a href="/admin/services.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Services</a>
      <a href="/admin/payments.html" class="sidebar-link"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/></svg>Payments</a>
      <hr class="my-3 border-gray-100"><button onclick="import('/js/auth.js').then(m => m.logoutUser())" class="sidebar-link w-full text-gray-500 hover:text-red-600">Logout</button>
    </nav>
  </aside>
  <div class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-100 z-30 lg:hidden flex items-center justify-between px-4">
    <span class="font-bold text-gray-900">Schedule</span>
    <button id="sidebar-toggle" class="p-2 rounded-lg hover:bg-gray-100" aria-label="Menu"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  </div>

  <div class="flex-1 lg:ml-64">
    <div class="p-4 sm:p-6 lg:p-8 pt-20 lg:pt-8 max-w-4xl mx-auto">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-8">Schedule Management</h1>

      <div class="space-y-6">
        <!-- Working Hours -->
        <div class="glass-card-strong rounded-2xl p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Default Working Hours</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Start Time</label><input type="time" id="start-time" value="09:00" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">End Time</label><input type="time" id="end-time" value="17:00" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Break Start</label><input type="time" id="break-start" value="13:00" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Break End</label><input type="time" id="break-end" value="13:30" class="input-field"></div>
            <div><label class="block text-sm font-medium text-gray-700 mb-1">Appointment Duration (min)</label><input type="number" id="duration" value="30" min="10" max="120" class="input-field"></div>
          </div>
          <button id="save-hours" class="btn-primary mt-4 text-sm">Save Schedule Settings</button>
        </div>

        <!-- Working Days -->
        <div class="glass-card-strong rounded-2xl p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Working Days</h2>
          <div class="flex flex-wrap gap-2">
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="1" class="w-4 h-4 text-blue-600"> Monday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="2" class="w-4 h-4 text-blue-600"> Tuesday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="3" class="w-4 h-4 text-blue-600"> Wednesday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="4" class="w-4 h-4 text-blue-600"> Thursday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="5" class="w-4 h-4 text-blue-600"> Friday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-sm font-medium"><input type="checkbox" checked value="6" class="w-4 h-4 text-blue-600"> Saturday</label>
            <label class="flex items-center gap-2 px-4 py-2 rounded-xl border-2 border-gray-200 text-sm font-medium text-gray-500"><input type="checkbox" value="0" class="w-4 h-4 text-blue-600"> Sunday</label>
          </div>
        </div>

        <!-- Blocked Dates -->
        <div class="glass-card-strong rounded-2xl p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Add Holiday / Blocked Date</h2>
          <div class="flex gap-3">
            <input type="date" id="holiday-date" class="input-field flex-1">
            <input type="text" id="holiday-reason" class="input-field flex-1" placeholder="Reason (optional)">
            <button id="add-holiday" class="btn-primary text-sm whitespace-nowrap">Add Holiday</button>
          </div>
          <div id="holidays-list" class="mt-4 space-y-2"></div>
        </div>

        <!-- Blocked Slots -->
        <div class="glass-card-strong rounded-2xl p-6">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Block Time Slot</h2>
          <div class="flex flex-wrap gap-3">
            <input type="date" id="block-date" class="input-field">
            <input type="time" id="block-time" class="input-field">
            <button id="add-block" class="btn-primary text-sm whitespace-nowrap">Block Slot</button>
          </div>
          <div id="blocks-list" class="mt-4 space-y-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>

  <script type="module">
    import { supabase, getCurrentUser, getProfile } from '/js/supabase.js';
    import { showToast, formatDate } from '/js/ui.js';

    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      const s = document.getElementById('sidebar'); s.classList.toggle('hidden'); s.classList.toggle('fixed'); s.classList.toggle('inset-0'); s.classList.toggle('z-50'); s.classList.toggle('w-full');
    });

    async function init() {
      const user = await getCurrentUser();
      if (!user) { window.location.href = '/login.html'; return; }
      const profile = await getProfile(user.id);
      if (!profile || (profile.role !== 'doctor' && profile.role !== 'admin')) { window.location.href = '/'; return; }

      await loadHolidays();
      await loadBlockedSlots();

      document.getElementById('add-holiday').addEventListener('click', async () => {
        const date = document.getElementById('holiday-date').value;
        if (!date) { showToast('Please select a date', 'warning'); return; }
        const { error } = await supabase.from('clinic_holidays').insert({ holiday_date: date, reason: document.getElementById('holiday-reason').value });
        if (error) { showToast('Failed to add holiday', 'error'); return; }
        showToast('Holiday added', 'success');
        document.getElementById('holiday-date').value = '';
        document.getElementById('holiday-reason').value = '';
        await loadHolidays();
      });

      document.getElementById('add-block').addEventListener('click', async () => {
        const date = document.getElementById('block-date').value;
        const time = document.getElementById('block-time').value;
        if (!date || !time) { showToast('Please select date and time', 'warning'); return; }
        const { error } = await supabase.from('blocked_slots').insert({ blocked_date: date, blocked_time: time + ':00' });
        if (error) { showToast('Failed to block slot', 'error'); return; }
        showToast('Slot blocked', 'success');
        document.getElementById('block-date').value = '';
        document.getElementById('block-time').value = '';
        await loadBlockedSlots();
      });

      document.getElementById('save-hours').addEventListener('click', () => showToast('Schedule settings saved (demo)', 'success'));
    }

    async function loadHolidays() {
      const { data } = await supabase.from('clinic_holidays').select('*').order('holiday_date');
      const container = document.getElementById('holidays-list');
      if (!data?.length) { container.innerHTML = '<p class="text-gray-500 text-sm">No holidays set.</p>'; return; }
      container.innerHTML = data.map(h => `
        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="text-sm">${formatDate(h.holiday_date)} ${h.reason ? `- ${h.reason}` : ''}</span>
          <button class="text-red-500 hover:text-red-700 text-sm delete-holiday" data-id="${h.id}">Remove</button>
        </div>
      `).join('');
      container.querySelectorAll('.delete-holiday').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabase.from('clinic_holidays').delete().eq('id', btn.dataset.id);
          showToast('Holiday removed', 'success');
          await loadHolidays();
        });
      });
    }

    async function loadBlockedSlots() {
      const { data } = await supabase.from('blocked_slots').select('*').order('blocked_date');
      const container = document.getElementById('blocks-list');
      if (!data?.length) { container.innerHTML = '<p class="text-gray-500 text-sm">No blocked slots.</p>'; return; }
      container.innerHTML = data.map(b => `
        <div class="flex items-center justify-between py-2 border-b border-gray-100">
          <span class="text-sm">${formatDate(b.blocked_date)} at ${b.blocked_time?.substring(0,5)}</span>
          <button class="text-red-500 hover:text-red-700 text-sm delete-block" data-id="${b.id}">Remove</button>
        </div>
      `).join('');
      container.querySelectorAll('.delete-block').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabase.from('blocked_slots').delete().eq('id', btn.dataset.id);
          showToast('Slot unblocked', 'success');
          await loadBlockedSlots();
        });
      });
    }

    init();
  </script>
</body>
</html>
