<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Appointments | Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
            colors: {
              primary: {
                50: "#eff6ff",
                100: "#dbeafe",
                200: "#bfdbfe",
                300: "#93c5fd",
                400: "#60a5fa",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
                800: "#1e40af",
                900: "#1e3a8a",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>"
    />
  </head>
  <body class="bg-gray-50 text-gray-900 min-h-screen flex">
    <aside
      id="sidebar"
      class="fixed left-0 top-0 bottom-0 w-64 bg-white border-r border-gray-100 z-40 hidden lg:flex flex-col"
    >
      <div class="p-5 border-b border-gray-100">
        <a href="/" class="flex items-center gap-2">
          <div
            class="w-9 h-9 rounded-xl gradient-primary flex items-center justify-center"
          >
            <svg
              class="w-5 h-5 text-white"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          </div>
          <div>
            <div class="text-sm font-bold text-gray-900">Dr. Arshadha</div>
            <div class="text-xs text-gray-500">Admin Panel</div>
          </div>
        </a>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <a href="/admin/index.html" class="sidebar-link"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" /></svg
          >Overview</a
        >
        <a href="/admin/appointments.html" class="sidebar-link active"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" /></svg
          >Appointments</a
        >
        <a href="/admin/patients.html" class="sidebar-link"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" /></svg
          >Patients</a
        >
        <a href="/admin/schedule.html" class="sidebar-link"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" /></svg
          >Schedule</a
        >
        <a href="/admin/services.html" class="sidebar-link"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
            /></svg
          >Services</a
        >
        <a href="/admin/payments.html" class="sidebar-link"
          ><svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="1" y="4" width="22" height="16" rx="2" /></svg
          >Payments</a
        >
        <hr class="my-3 border-gray-100" />
        <button
          onclick="import('/js/auth.js').then((m) => m.logoutUser())"
          class="sidebar-link w-full text-gray-500 hover:text-red-600"
        >
          Logout
        </button>
      </nav>
    </aside>

    <div
      class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-gray-100 z-30 lg:hidden flex items-center justify-between px-4"
    >
      <span class="font-bold text-gray-900">Appointments</span>
      <button
        id="sidebar-toggle"
        class="p-2 rounded-lg hover:bg-gray-100"
        aria-label="Menu"
      >
        <svg
          class="w-6 h-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>

    <div class="flex-1 lg:ml-64">
      <div class="p-4 sm:p-6 lg:p-8 pt-20 lg:pt-8 max-w-7xl mx-auto">
        <div
          class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4"
        >
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
            Appointments
          </h1>
          <div class="flex gap-3">
            <input
              type="date"
              id="filter-date"
              class="input-field text-sm py-2"
            />
            <select id="filter-status" class="input-field text-sm py-2">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
              <option value="no_show">No Show</option>
            </select>
          </div>
        </div>

        <!-- Desktop table -->
        <div class="hidden md:block card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="bg-gray-50 text-left">
                  <th class="px-4 py-3 font-medium text-gray-500">Patient</th>
                  <th class="px-4 py-3 font-medium text-gray-500">Service</th>
                  <th class="px-4 py-3 font-medium text-gray-500">
                    Date & Time
                  </th>
                  <th class="px-4 py-3 font-medium text-gray-500">Status</th>
                  <th class="px-4 py-3 font-medium text-gray-500">Payment</th>
                  <th class="px-4 py-3 font-medium text-gray-500">Actions</th>
                </tr>
              </thead>
              <tbody id="appointments-table" class="divide-y divide-gray-100">
                <tr>
                  <td colspan="6" class="px-4 py-8 text-center text-gray-500">
                    <div
                      class="w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"
                    ></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Mobile cards -->
        <div id="appointments-cards" class="md:hidden space-y-3"></div>
      </div>
    </div>

    <!-- Action Modal -->
    <div
      id="action-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4"
    >
      <div
        class="fixed inset-0 bg-black/50 backdrop-blur-sm"
        id="modal-bg"
      ></div>
      <div
        class="relative bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto"
      >
        <div class="p-6" id="modal-body"></div>
      </div>
    </div>

    <div
      id="toast-container"
      class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"
    ></div>

    <script type="module">
      import { supabase, getCurrentUser, getProfile } from "/js/supabase.js";
      import {
        updateAppointmentStatus,
        rescheduleAppointment,
      } from "/js/appointments.js";
      import {
        showToast,
        renderStatusBadge,
        formatDate,
        formatTime,
      } from "/js/ui.js";

      document
        .getElementById("sidebar-toggle")
        ?.addEventListener("click", () => {
          const s = document.getElementById("sidebar");
          s.classList.toggle("hidden");
          s.classList.toggle("fixed");
          s.classList.toggle("inset-0");
          s.classList.toggle("z-50");
          s.classList.toggle("w-full");
        });

      let allAppts = [];

      async function init() {
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = "/login.html";
          return;
        }
        const profile = await getProfile(user.id);
        if (
          !profile ||
          (profile.role !== "doctor" && profile.role !== "admin")
        ) {
          window.location.href = "/";
          return;
        }

        await loadAppointments();
        document
          .getElementById("filter-date")
          .addEventListener("change", applyFilters);
        document
          .getElementById("filter-status")
          .addEventListener("change", applyFilters);
      }

      async function loadAppointments() {
        try {
          const { data, error } = await supabase
            .from("appointments")
            .select(
              "*, service:services(name), patient:profiles!appointments_patient_id_fkey(full_name, phone)",
            )
            .order("appointment_date", { ascending: false })
            .order("appointment_time");
          if (error) throw error;
          allAppts = data || [];
          applyFilters();
        } catch (e) {
          showToast("Failed to load", "error");
        }
      }

      function applyFilters() {
        const date = document.getElementById("filter-date").value;
        const status = document.getElementById("filter-status").value;
        let filtered = [...allAppts];
        if (date)
          filtered = filtered.filter((a) => a.appointment_date === date);
        if (status) filtered = filtered.filter((a) => a.status === status);
        renderTable(filtered);
      }

      function renderTable(appts) {
        const tableBody = document.getElementById("appointments-table");
        const cardsContainer = document.getElementById("appointments-cards");

        if (!appts.length) {
          const empty =
            '<tr><td colspan="6" class="px-4 py-8 text-center text-gray-500">No appointments found.</td></tr>';
          tableBody.innerHTML = empty;
          cardsContainer.innerHTML =
            '<div class="card p-6 text-center text-gray-500">No appointments found.</div>';
          return;
        }

        tableBody.innerHTML = appts
          .map(
            (a) => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3"><div class="font-medium text-gray-900">${a.patient?.full_name || "Unknown"}</div><div class="text-xs text-gray-500">${a.patient_phone || ""}</div></td>
          <td class="px-4 py-3 text-gray-700">${a.service?.name || "Consultation"}</td>
          <td class="px-4 py-3"><div class="text-gray-900">${formatDate(a.appointment_date)}</div><div class="text-xs text-gray-500">${formatTime(a.appointment_time?.substring(0, 5))}${a.token_number ? ` · Token #${a.token_number}` : ""}</div></td>
          <td class="px-4 py-3">${renderStatusBadge(a.status)}</td>
          <td class="px-4 py-3">${renderStatusBadge(a.payment_status, "payment")}</td>
          <td class="px-4 py-3 whitespace-nowrap">
            ${a.status !== "completed" && a.status !== "cancelled" ? `<button class="text-emerald-600 hover:underline text-sm font-medium mr-3" data-attended="${a.id}">Attended</button>` : ""}
            <button class="text-blue-600 hover:underline text-sm font-medium" data-action="${a.id}">Manage</button>
          </td>
        </tr>
      `,
          )
          .join("");

        cardsContainer.innerHTML = appts
          .map(
            (a) => `
        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <span class="font-medium text-gray-900">${a.patient?.full_name || "Unknown"}</span>
            ${renderStatusBadge(a.status)}
          </div>
          <div class="text-sm text-gray-500 mb-2">${a.service?.name || "Consultation"} &middot; ${formatDate(a.appointment_date)} at ${formatTime(a.appointment_time?.substring(0, 5))}${a.token_number ? ` · Token #${a.token_number}` : ""}</div>
          <div class="flex items-center gap-4">
            ${a.status !== "completed" && a.status !== "cancelled" ? `<button class="text-emerald-600 hover:underline text-sm font-medium" data-attended="${a.id}">Attended</button>` : ""}
            <button class="text-blue-600 hover:underline text-sm font-medium" data-action="${a.id}">Manage</button>
          </div>
        </div>
      `,
          )
          .join("");

        document.querySelectorAll("[data-action]").forEach((btn) => {
          btn.addEventListener("click", () => openModal(btn.dataset.action));
        });

        document.querySelectorAll("[data-attended]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            const result = await updateAppointmentStatus(
              btn.dataset.attended,
              "completed",
            );
            if (result.error) {
              showToast(result.error, "error");
              btn.disabled = false;
              return;
            }
            showToast("Token marked as attended. Queue updated for patients.", "success");
            await loadAppointments();
          });
        });
      }

      function openModal(id) {
        const a = allAppts.find((ap) => ap.id === id);
        if (!a) return;
        const modal = document.getElementById("action-modal");
        const body = document.getElementById("modal-body");

        body.innerHTML = `
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-lg font-bold text-gray-900">Manage Appointment</h3>
          <button onclick="document.getElementById('action-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600" aria-label="Close"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="bg-gray-50 rounded-xl p-4 space-y-2 mb-6">
          <div class="flex justify-between text-sm"><span class="text-gray-500">Patient</span><span class="font-medium">${a.patient?.full_name || "Unknown"}</span></div>
          <div class="flex justify-between text-sm"><span class="text-gray-500">Service</span><span class="font-medium">${a.service?.name || "Consultation"}</span></div>
          <div class="flex justify-between text-sm"><span class="text-gray-500">Date</span><span class="font-medium">${formatDate(a.appointment_date)}</span></div>
          <div class="flex justify-between text-sm"><span class="text-gray-500">Time</span><span class="font-medium">${formatTime(a.appointment_time?.substring(0, 5))}</span></div>
          ${a.token_number ? `<div class="flex justify-between text-sm"><span class="text-gray-500">Token</span><span class="font-mono font-semibold text-blue-700">#${a.token_number}</span></div>` : ""}
          <div class="flex justify-between text-sm"><span class="text-gray-500">Status</span>${renderStatusBadge(a.status)}</div>
          <div class="flex justify-between text-sm"><span class="text-gray-500">Phone</span><span class="font-medium">${a.patient_phone || "-"}</span></div>
          ${a.patient_notes ? `<div class="text-sm"><span class="text-gray-500">Notes:</span><p class="text-gray-700 mt-1">${a.patient_notes}</p></div>` : ""}
        </div>
        <div class="space-y-3">
          <h4 class="font-medium text-gray-900 text-sm">Update Status</h4>
          <div class="grid grid-cols-2 gap-2">
            <button class="modal-action px-3 py-2 bg-green-50 text-green-700 rounded-lg text-sm font-medium hover:bg-green-100" data-status="confirmed">Confirm</button>
            <button class="modal-action px-3 py-2 bg-blue-50 text-blue-700 rounded-lg text-sm font-medium hover:bg-blue-100" data-status="completed">Mark Completed</button>
            <button class="modal-action px-3 py-2 bg-amber-50 text-amber-700 rounded-lg text-sm font-medium hover:bg-amber-100" data-status="no_show">No Show</button>
            <button class="modal-action px-3 py-2 bg-red-50 text-red-700 rounded-lg text-sm font-medium hover:bg-red-100" data-status="cancelled">Cancel</button>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Admin Notes</label>
            <textarea id="admin-notes" class="input-field text-sm" rows="2" placeholder="Add notes...">${a.admin_notes || ""}</textarea>
          </div>
        </div>
      `;

        modal.classList.remove("hidden");
        modal.classList.add("flex");
        document.getElementById("modal-bg").addEventListener("click", () => {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        });

        body.querySelectorAll(".modal-action").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const notes = document.getElementById("admin-notes").value;
            const result = await updateAppointmentStatus(
              a.id,
              btn.dataset.status,
              notes,
            );
            if (result.error) {
              showToast(result.error, "error");
              return;
            }
            showToast(`Appointment ${btn.dataset.status}.`, "success");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            await loadAppointments();
          });
        });
      }

      init();
    </script>
  </body>
</html>
