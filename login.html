<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Login | Dr. Arshadha</title>
  <meta name="description" content="Staff login for Dr. Arshadha's appointment system.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']},colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}}}}}</script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center justify-center gradient-mesh px-4">
  <div class="w-full max-w-md animate-fade-in">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-xl gradient-primary flex items-center justify-center">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
      </a>
      <h1 class="text-2xl font-bold text-gray-900">Doctor Login</h1>
      <p class="text-gray-500 mt-1">Patients don't need an account — just book and get your token</p>
    </div>

    <div class="glass-card-strong rounded-2xl p-8">
      <form id="login-form" novalidate>
        <div class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" required class="input-field" placeholder="name@example.com">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" autocomplete="current-password" required class="input-field pr-12" placeholder="Enter your password">
              <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Show password">
                <svg class="w-5 h-5 eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="w-5 h-5 eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl"></div>
          <button type="submit" id="login-btn" class="w-full btn-primary py-3.5 text-center relative">
            <span id="login-text">Sign In</span>
            <span id="login-spinner" class="hidden">
              <svg class="animate-spin h-5 w-5 mx-auto text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            </span>
          </button>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      <a href="/" class="hover:text-gray-600">&larr; Back to home</a>
    </p>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>

  <script type="module">
    import { supabase, getProfile } from '/js/supabase.js';
    import { loginUser } from '/js/auth.js';
    import { showToast } from '/js/ui.js';
    import { validateEmail } from '/js/validation.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      const profile = await Promise.race([
        getProfile(session.user.id),
        new Promise(r => setTimeout(() => r(null), 3000))
      ]);
      if (profile?.role === 'doctor' || profile?.role === 'admin') {
        window.location.href = './admin/index.html';
      } else {
        await supabase.auth.signOut();
        showToast('Patients do not need an account. Please book an appointment instead.', 'info', 6000);
      }
    }

    const form = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const loginText = document.getElementById('login-text');
    const loginSpinner = document.getElementById('login-spinner');
    const loginError = document.getElementById('login-error');

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      document.querySelector('.eye-open').classList.toggle('hidden', !isPassword);
      document.querySelector('.eye-closed').classList.toggle('hidden', isPassword);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email) {
        loginError.textContent = 'Please enter your registered email address.';
        loginError.classList.remove('hidden');
        return;
      }
      if (!validateEmail(email)) {
        loginError.textContent = 'Please enter a valid email address (e.g. name@example.com). Usernames cannot be used to sign in.';
        loginError.classList.remove('hidden');
        return;
      }
      if (!password) {
        loginError.textContent = 'Please enter your password.';
        loginError.classList.remove('hidden');
        return;
      }

      loginBtn.disabled = true;
      loginText.classList.add('hidden');
      loginSpinner.classList.remove('hidden');

      const result = await loginUser(email, password);

      loginBtn.disabled = false;
      loginText.classList.remove('hidden');
      loginSpinner.classList.add('hidden');

      if (result.error) {
        if (result.error.toLowerCase().includes('invalid login credentials')) {
          loginError.textContent = 'Invalid email or password. Please check your credentials and try again.';
        } else {
          loginError.textContent = result.error;
        }
        loginError.classList.remove('hidden');
        return;
      }

      showToast('Login successful! Redirecting...', 'success');
      const profile = await Promise.race([
        getProfile(result.user.id),
        new Promise(r => setTimeout(() => r(null), 3000))
      ]);
      if (profile?.role === 'patient') {
        await supabase.auth.signOut();
        loginBtn.disabled = false;
        loginText.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
        loginError.textContent = 'This portal is for doctors only. Patients can book directly without an account.';
        loginError.classList.remove('hidden');
        return;
      }
      setTimeout(() => {
        window.location.href = './admin/index.html';
      }, 500);
    });
  </script>
</body>
</html>
